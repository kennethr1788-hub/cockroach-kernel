[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cockroach-kernel"
version = "0.1.0"
description = "Deterministic trajectory recovery evidence CLI"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
aws-demo = [
  "pg8000==1.31.5",
  "scramp==1.4.15",
  "asn1crypto==1.5.1",
  "python-dateutil==2.9.0.post0",
  "six==1.17.0",
]

[project.scripts]
cockroach-kernel = "cockroach_kernel.cli:main"

[tool.setuptools]
include-package-data = false
packages = ["cockroach_kernel", "p7_runtime", "p9_runtime", "verifier_runtime"]

[tool.setuptools.package-dir]
cockroach_kernel = "cockroach_kernel"
p7_runtime = "p7-recovery"
p9_runtime = "p9-cloud"
verifier_runtime = "p4-verifier"

[tool.setuptools.package-data]
p7_runtime = ["*.json", "migrations/*.sql"]
p9_runtime = ["*.json", "migrations/*.sql"]
verifier_runtime = ["*.json"]
